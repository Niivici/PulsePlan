spring.datasource.url=${PULSEPLAN_DB_URL:jdbc:postgresql://localhost:5432/pulseplan}
spring.datasource.username=${PULSEPLAN_DB_USERNAME:pulseplan}
spring.datasource.password=${PULSEPLAN_DB_PASSWORD:}
pulseplan.admin.username=${PULSEPLAN_ADMIN_USERNAME:}
pulseplan.admin.password=${PULSEPLAN_ADMIN_PASSWORD:}

pulseplan.ai.url=${PULSEPLAN_AI_URL:https://api.deepseek.com/chat/completions}
pulseplan.ai.model=${PULSEPLAN_AI_MODEL:deepseek-v4-pro}
pulseplan.ai.key=${DEEPSEEK_API_KEY:}
pulseplan.ai.daily-account-limit=${PULSEPLAN_AI_DAILY_ACCOUNT_LIMIT:10}
pulseplan.ai.daily-global-limit=${PULSEPLAN_AI_DAILY_GLOBAL_LIMIT:100}
